services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: soc_postgres
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Твое Go-приложение
  app:
    build: .
    container_name: soc_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=soc_user
      - DB_PASSWORD=soc_password
      - DB_NAME=soc_db
      # ⚠️ ВАЖНО: Замени эти значения на свои реальные перед запуском!
      - TELEGRAM_BOT_TOKEN=8704573548:AAGDcSx6uE0IpRQDia0yEo6LFu5jM8xDSzo
      - SOC_ENGINEER_CHAT_ID=1852630149
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: