services:
  db:
    image: postgres:15-alpine
    container_name: soc_postgres
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d  #  ДОБАВЬ ЭТУ СТРОКУ!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: soc_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=soc_user
      - DB_PASSWORD=soc_password
      - DB_NAME=soc_db
      - TELEGRAM_BOT_TOKEN=1852630149
      - SOC_ENGINEER_CHAT_ID=8704573548:AAGDcSx6uE0IpRQDia0yEo6LFu5jM8xDSzo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: